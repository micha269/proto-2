services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cooptech-backend
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-docker-change-me}
    volumes:
      - cooptech_cache:/app/.cache
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY:-}
        VITE_API_URL: ""
    container_name: cooptech-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cooptech_cache:
